[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-benchmark"
version = "0.1.0"
description = "Offline-first benchmark comparing agent configurations on identical tasks"
requires-python = ">=3.13"
dependencies = [
    # execution contract v1, tag v0.1.0 pinned by commit SHA (tags can move)
    "agent-harness @ git+https://github.com/chrobakpiotr/agent-harness.git@e57fda8477675fd0722878e4993b19651a6aedc4",
]

[project.scripts]
agent-benchmark = "agent_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
